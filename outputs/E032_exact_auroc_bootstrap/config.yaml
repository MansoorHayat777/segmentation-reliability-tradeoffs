experiment: E032_exact_auroc_bootstrap
family: 25 endpoint-specific-vs-mixed comparisons (5 panels x 5 endpoints); Holm across
  all 25
auroc_members: recomputed exactly per image-cluster draw
rank_members: unchanged; stored E028 one_sided_p_unadjusted (bit-exact re-execution
  in Phase 0)
secondary: mixed (h_M) vs best single at the 0.25 high-error threshold, best single
  fixed from full data (E027); also vs all 8 singles
tail_frequency: 'p = (1 + #{delta* <= 0}) / (B_valid + 1); draws lacking a class are
  undefined and excluded'
bootstrap:
  draws: 5000
  unit: image cluster (all six models)
  interval: percentile
  confidence: 0.95
null_calibration:
  panel: PASCAL-VOC-2012-val
  replicates: 200
  bootstrap_draws_per_replicate: 5000
  alpha: 0.05
  nulls:
  - within-image label permutation (specified)
  - paired exchange of compared scores (supplementary)
  comparisons:
  - severe_miss routed-vs-mixed
  - false_positive routed-vs-mixed
  - mixed vs best single (t=0.25)
